openapi: 3.0.3
info:
  title: AI Hotspot Radar API
  version: 2.0.0
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Application is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/radar/runs:
    post:
      operationId: requestRadarRun
      description: Enqueue one manual radar round. Reusing requestId is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RadarRunRequest'
      responses:
        '202':
          description: A radar round was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadarRunAccepted'
        default:
          $ref: '#/components/responses/Error'
  /api/radar:
    get:
      operationId: getRadar
      responses:
        '200':
          description: Current retained radar snapshot and self-contained dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadarSnapshot'
        default:
          $ref: '#/components/responses/Error'
  /api/radar/backtests:
    post:
      operationId: backtestRadar
      description: Detect candidates blindly from historical items, then compare with a named known hotspot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: Detection timing relative to broad discussion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResult'
        default:
          $ref: '#/components/responses/Error'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    RadarRunRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    RadarRunAccepted:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    RadarEvidence:
      type: object
      additionalProperties: false
      required: [id, title, text, author, score, url, observedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        text:
          type: string
        author:
          type: string
        score:
          type: integer
        url:
          type: string
        observedAt:
          type: string
          format: date-time
    RadarHotspot:
      type: object
      additionalProperties: false
      required: [name, concept, primitives, primitives_en, search_terms, domain, authorCount, firstSeen, evidence]
      properties:
        name:
          type: string
        concept:
          type: string
        primitives:
          type: array
          items:
            type: string
        primitives_en:
          type: array
          items:
            type: string
        search_terms:
          type: array
          items:
            type: string
        domain:
          type: string
          enum: [general, science, medical, neuroscience]
        authorCount:
          type: integer
        firstSeen:
          type: string
          format: date-time
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/RadarEvidence'
    RadarSnapshot:
      type: object
      additionalProperties: false
      required: [roundNumber, status, lastRunAt, nextRunAt, newHotspots, noiseCount, pendingCount, sourceStatus, report, html, hotspots]
      properties:
        roundNumber:
          type: integer
        status:
          type: string
        lastRunAt:
          type: string
          format: date-time
        nextRunAt:
          type: string
          format: date-time
        newHotspots:
          type: integer
        noiseCount:
          type: integer
        pendingCount:
          type: integer
        sourceStatus:
          type: string
        report:
          type: string
        html:
          type: string
        hotspots:
          type: array
          items:
            $ref: '#/components/schemas/RadarHotspot'
    BacktestItem:
      type: object
      additionalProperties: false
      required: [time, title, text, author, score]
      properties:
        time:
          type: string
          format: date-time
        title:
          type: string
          minLength: 1
        text:
          type: string
        author:
          type: string
        score:
          type: integer
          minimum: 0
    BacktestRequest:
      type: object
      additionalProperties: false
      required: [knownHotspot, widespreadAt, items]
      properties:
        knownHotspot:
          type: string
          minLength: 1
        widespreadAt:
          type: string
          format: date-time
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/BacktestItem'
    BacktestResult:
      type: object
      additionalProperties: false
      required: [detected, detectedAt, leadHours, interpretation]
      properties:
        detected:
          type: boolean
        detectedAt:
          type: string
          format: date-time
        leadHours:
          type: number
          format: double
        interpretation:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          maxLength: 3000
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
